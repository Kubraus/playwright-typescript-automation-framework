stages:
  - checks
  - smoke
  - regression

lint:
  stage: checks
  image: node:20
  script:
    - npm ci
    - npm run lint

typecheck:
  stage: checks
  image: node:20
  script:
    - npm ci
    - npm run typecheck

smoke:
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  script:
    - npm ci
    - npm run test:smoke
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 7 days

regression:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  script:
    - npm ci
    - npm run test:regression
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 7 days